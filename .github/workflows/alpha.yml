name: Publish Windows Alpha
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/alpha.yml']
permissions:
  contents: read
concurrency:
  group: elix-alpha
  cancel-in-progress: false
jobs:
  # Requires native download failure correlation by NavigationId.
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build standalone Alpha 1 without automatic updates
        shell: pwsh
        run: |
          node scripts/set-version.mjs 0.1.0-dev.1 developer
          npm install --package-lock-only --ignore-scripts
          cargo update --manifest-path src-tauri/Cargo.toml --workspace
          npm run tauri build -- --bundles nsis -- --locked
          if ($LASTEXITCODE -ne 0) { throw 'Alpha build failed' }
      - name: Install and verify distributable alpha starts
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*_0.1.0-dev.1_*-setup.exe | Select-Object -First 1
          $dest = Join-Path $env:RUNNER_TEMP 'ELIX-alpha'
          $p = Start-Process $installer.FullName -ArgumentList @('/S', "/D=$dest") -PassThru
          if (!$p.WaitForExit(120000) -or $p.ExitCode -ne 0) { throw 'Alpha installation failed' }
          $app = Start-Process "$dest/elix-browser.exe" -PassThru
          Start-Sleep -Seconds 12
          $app.Refresh()
          if ($app.HasExited) { throw 'Alpha exited at startup' }
          Stop-Process -Id $app.Id
      - name: Publish alpha installer and checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*_0.1.0-dev.1_*-setup.exe | Select-Object -First 1
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($installer.Name)" | Set-Content SHA256SUMS.txt
          @'
          # ELIX Browser Alpha 1

          Første offentlige testversjon for Windows 11 x64. Last ned `ELIX Browser_0.1.0-dev.1_x64-setup.exe` under Assets og installer for din bruker. Ingen egen server kreves.

          Native WebView2-faner, adressefelt/navigasjon, bokmerker, historikk, profiler, nedlastinger, gaming-startside og ekte DevTools. Windows-integrasjonstester og installert oppstart er kjørt i CI før publisering.

          Dette er en alpha, ikke en stabil utgivelse. Automatiske ELIX-oppdateringer er deaktivert i dette bygget: installer senere versjoner manuelt. Ingen usignerte oppdateringer godtas. Programmet er ikke Authenticode-signert; Windows kan vise ukjent utgiver/SmartScreen. WebView2 Runtime installeres ved behov.

          Begrensninger: ingen utvidelser/privatmodus/passordlagring, kamera/mikrofon/location-tillatelser støttes ikke ennå, og fanehvile laster sider på nytt. Se docs/LIMITATIONS.md. Behold viktig informasjon også i din vanlige nettleser under testing.
          '@ | Set-Content alpha-notes.md
          gh release view v0.1.0-dev.1 --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'Alpha already published; existing installers are never overwritten' }
          gh release create v0.1.0-dev.1 $installer.FullName SHA256SUMS.txt --target $env:GITHUB_SHA --title 'ELIX Browser Alpha 1 — Windows' --notes-file alpha-notes.md --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Alpha publication failed' }
