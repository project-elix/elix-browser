name: Windows verification
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'website/**', 'README.md']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      ELIX_ACCOUNTS_URL: ${{ vars.ELIX_ACCOUNTS_URL || 'https://medlem.projectelix.no' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm ci --prefix services/accounts --omit=dev --ignore-scripts
      - run: npm test
      - run: npm run check:release
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: npm run tauri build -- --features smoke-tests --bundles nsis -- --locked
      - name: Test installed app starts
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $dest = Join-Path $env:RUNNER_TEMP 'ELIX-smoke'
          $p = Start-Process $installer.FullName -ArgumentList @('/S', "/D=$dest") -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Installer failed: $($p.ExitCode)" }
          $exe = Join-Path $dest 'elix-browser.exe'
          if (!(Test-Path $exe)) { throw 'Installed executable missing' }
          $capability = Get-ItemPropertyValue 'HKCU:\Software\RegisteredApplications' 'ELIX Browser'
          if ($capability -ne 'Software\Clients\StartMenuInternet\ELIX Browser\Capabilities') { throw 'Default browser registration missing' }
          $associations = Get-ItemProperty "HKCU:\$capability\URLAssociations"
          if ($associations.http -ne 'ELIXBrowserHTML' -or $associations.https -ne 'ELIXBrowserHTML') { throw 'HTTP/HTTPS associations missing' }
          $openCommand = (Get-Item 'HKCU:\Software\Classes\ELIXBrowserHTML\shell\open\command').GetValue('')
          Write-Output "Registered browser command: $openCommand"
          if ($openCommand -notmatch '^"([^"]+)" --url "%1"$') { throw 'Browser URL launch command arguments differ' }
          $registeredExe = [IO.Path]::GetFullPath($Matches[1])
          if ($registeredExe -ne [IO.Path]::GetFullPath($exe)) { throw "Browser executable differs: registered=$registeredExe installed=$exe" }
          $app = Start-Process $exe -PassThru
          Start-Sleep -Seconds 12
          $app.Refresh()
          if ($app.HasExited) { throw 'Application exited during startup' }
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          $screen = [Windows.Forms.Screen]::PrimaryScreen.Bounds
          $image = [Drawing.Bitmap]::new($screen.Width,$screen.Height)
          $graphics = [Drawing.Graphics]::FromImage($image)
          try {
            $graphics.CopyFromScreen($screen.Location,[Drawing.Point]::Empty,$screen.Size)
            $image.Save((Join-Path $PWD 'windows-start.png'),[Drawing.Imaging.ImageFormat]::Png)
          } finally { $graphics.Dispose(); $image.Dispose() }
          Stop-Process -Id $app.Id
      - name: Native WebView2 integration test
        shell: pwsh
        run: |
          $env:ELIX_SMOKE_RESULT = Join-Path $PWD "native-smoke.txt"
          $test = Start-Process "$env:RUNNER_TEMP/ELIX-smoke/elix-browser.exe" -ArgumentList "--self-test" -PassThru
          if (!$test.WaitForExit(240000)) { Stop-Process -Id $test.Id; throw "Native smoke test timed out" }
          if (Test-Path $env:ELIX_SMOKE_RESULT) { Get-Content $env:ELIX_SMOKE_RESULT }
          if ($test.ExitCode -ne 0 -or !(Test-Path $env:ELIX_SMOKE_RESULT)) { throw "Native smoke test failed" }
      - name: Measure idle resource budget
        shell: pwsh
        run: ./scripts/measure-performance.ps1 -Executable "$env:RUNNER_TEMP/ELIX-smoke/elix-browser.exe" -Seconds 30 -Output performance.csv
      - uses: actions/upload-artifact@v4
        with:
          name: ELIX-Windows-development-build
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            performance.csv
            windows-start.png
            native-smoke.txt
            native-*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ELIX-Windows-test-diagnostics
          path: |
            windows-start.png
            native-smoke.txt
            native-*.png
          if-no-files-found: warn

