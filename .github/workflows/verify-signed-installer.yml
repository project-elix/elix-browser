name: Verify existing signed installer UI
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version of the signed draft to verify
        required: true
        type: string
      source_sha:
        description: Exact original release source commit
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version }}
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact existing draft without rebuilding or publishing
        shell: pwsh
        run: |
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+-(beta|dev)\.\d+$') { throw 'Invalid version' }
          if ($env:SOURCE_SHA -notmatch '^[a-f0-9]{40}$') { throw 'Invalid source SHA' }
          $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          $matches = @($releases | Where-Object { $_.tag_name -eq "v$env:RELEASE_VERSION" -and $_.draft })
          if ($LASTEXITCODE -ne 0 -or $matches.Count -ne 1 -or $matches[0].target_commitish -ne $env:SOURCE_SHA) { throw 'Draft source mismatch' }
          $release = $matches[0]
          gh release download "v$env:RELEASE_VERSION" --repo $env:GITHUB_REPOSITORY --pattern '*.exe' --pattern '*.sig' --dir signed-input
          if ($LASTEXITCODE -ne 0) { throw 'Draft download failed' }
          $files = @(Get-ChildItem signed-input/*.exe)
          if ($files.Count -ne 1) { throw 'Expected one installer' }
          $asset = @($release.assets | Where-Object name -eq $files[0].Name)
          $digest = 'sha256:' + (Get-FileHash $files[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($asset.Count -ne 1 -or $asset[0].digest -ne $digest) { throw 'Installer digest mismatch' }
          New-Item -ItemType Directory -Force installer-review | Out-Null
          @{version=$env:RELEASE_VERSION;source=$env:SOURCE_SHA;digest=$digest;asset_id=$asset[0].id} | ConvertTo-Json | Set-Content installer-review/source.json
      - name: Wait for the installed production browser to become usable
        shell: powershell
        run: |
          $installer = Get-ChildItem signed-input/*.exe | Select-Object -First 1
          ./scripts/verify-installed-ui.ps1 -Installer $installer.FullName -OutputDirectory (Join-Path $PWD 'installer-review')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signed-installer-ui-review
          path: installer-review/
