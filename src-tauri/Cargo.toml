[package]
name = "elix-browser"
version = "0.1.4-dev.9"
edition = "2021"
rust-version = "1.88"

[features]
default = []
smoke-tests = []

[lib]
name = "elix_browser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["unstable", "devtools"] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
sysinfo = "0.37"
chrono = { version = "0.4", features = ["serde"] }
semver = "1"
base64 = "0.22"
zip = { version = "=9.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Security_Cryptography"] }

[dev-dependencies]
tempfile = "3"
